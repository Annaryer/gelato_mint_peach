<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Ice Cream</title>
    <link rel="stylesheet" href="/Static/style.css">
</head>
<body>
<nav>
    <div class="nav-logo">🍨 Gelato Mint & Peach</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/order">Order</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </div>
</nav>
<section class="page-header">
    <p class="small-title">ADMIN</p>
    <h1>Edit Flavor ✍️</h1>
</section>

<form
    action="/update/{{ icecream['id'] }}"
    method="post"
    class="icecream-form"
>
    <label>Ice Cream Name:</label>
    <input
        type="text"
        name="name"
        value="{{ icecream['name'] }}"
        required
    >

    <label>Type / Category:</label>
    <input
        type="text"
        name="type"
        value="{{ icecream['type'] }}"
        required
    >
    <label>Price (AMD):</label>
    <input
        type="number"
        name="price"
        value="{{ icecream['price'] }}"
        required
    >
    <button type="submit">
        💾 Save Changes
    </button>
</form>
<div class="center">
    <a href="/" class="secondary-btn">
        ← Back
    </a>
</div>
</body>
</html>
